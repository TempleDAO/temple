name: Vercel preview deploy
on:
  pull_request:
    types: [opened, labeled, synchronize]

jobs:
  vercel-deploy:
    if: contains(github.event.pull_request.labels.*.name, 'preview-deploy')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.DAPP_PROJECT_ID }}
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deploy to Vercel
        id: deploy_step
        run: |
          npx vercel pull --yes --environment=preview -A apps/dapp/vercel.json
          npx vercel build -A apps/dapp/vercel.json
          DEPLOYMENT_URL=$(npx vercel deploy --prebuilt -A apps/dapp/vercel.json 2>&1 | grep -E '^https://' | tail -1)
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          npx vercel alias set "$DEPLOYMENT_URL" "pr-${{ github.event.number }}-preview.templedao.link" --scope "$VERCEL_ORG_ID"
        continue-on-error: true
      - name: Comment on PR
        if: steps.deploy_step.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Preview deployed: ${{ steps.deploy_step.outputs.deployment_url }}`
            })
      - name: "notify failure"
        if: steps.deploy_step.outcome == 'failure'
        uses: rjstone/discord-webhook-notify@v1
        with:
          severity: error
          description: Deploy to Vercel failed!
          details: "[PR Details](${{ github.event.pull_request._links.html.href }})"
          footer: PR ${{ github.event.number }}
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: "fail"
        if: steps.deploy_step.outcome == 'failure'
        run: exit 1
      - name: "notify success"
        uses: rjstone/discord-webhook-notify@v1
        with:
          severity: info
          description: (Dapp) PREVIEW Deploy to Vercel succeeded!
          details: "[View Preview](${{ steps.deploy_step.outputs.deployment_url }}) | [PR Details](${{ github.event.pull_request._links.html.href }})"
          footer: PR ${{ github.event.number }}
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK_URL }}
