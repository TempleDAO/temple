name: dapp => stage
on:
  push:
    branches:
      - 'stage'
    paths:
      - "apps/dapp/**"
      - ".github/workflows/dapp-stage.yaml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.DAPP_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Deploy to Vercel
        id: deploy_step
        run: |
          set -euo pipefail
          vcl() { npx --yes vercel@52.0.0 -A apps/dapp/vercel.json "$@"; }
          vcl pull --yes --environment=preview
          vcl build
          DEPLOYMENT_URL=$(vcl deploy --prebuilt)
          echo "deployment_url=$DEPLOYMENT_URL" >> $GITHUB_OUTPUT
          vcl alias set "$DEPLOYMENT_URL" "stage.templedao.link" --scope "$VERCEL_ORG_ID"
        continue-on-error: true
      - name: "notify failure"
        if: steps.deploy_step.outcome == 'failure'
        uses: rjstone/discord-webhook-notify@v1
        with:
          severity: error
          description: (Dapp) STAGE Deploy to Vercel failed!
          details: Check the GH Action or Vercel logs for details.
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: "fail"
        if: steps.deploy_step.outcome == 'failure'
        run: exit 1
      - name: "notify success"
        uses: rjstone/discord-webhook-notify@v1
        with:
          severity: info
          description: (Dapp) STAGE Deploy to Vercel succeeded!
          details: "[View Stage Deployment](https://stage.templedao.link)"
          webhookUrl: ${{ secrets.DISCORD_WEBHOOK_URL }}
